name: update data

on:
  schedule:
    # Every 3 hours. Hourly also works -- change to '0 * * * *' -- but each run
    # commits refreshed Parquet + JSON, so a faster cadence grows the repo
    # faster. See DEPLOY.md for the Git LFS / release-asset alternatives.
    - cron: '17 */3 * * *'
  workflow_dispatch:

# Never let two runs write the store at once.
concurrency:
  group: gridcast-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      # Rebuilds the DuckDB working store from the committed Parquet snapshots.
      - name: Restore store
        run: uv run gridcast init

      - name: Fetch latest
        env:
          # Optional: unlocks the EIA deep-history backbone. The run succeeds
          # without it -- CAISO and Open-Meteo need no credentials at all.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: uv run gridcast update --verbose

      - name: Render static site data
        run: |
          uv run gridcast export
          uv run gridcast snapshot
          uv run gridcast stats

      - name: Commit if anything changed
        run: |
          git config user.name  'gridcast-bot'
          git config user.email 'gridcast-bot@users.noreply.github.com'
          git add data/parquet web/data
          if git diff --staged --quiet; then
            echo 'no change'
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
