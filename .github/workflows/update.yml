name: update data

on:
  schedule:
    # Every 6 hours. Each run commits refreshed JSON, so a faster cadence grows
    # the repo faster -- '17 */3 * * *' (4x/day -> 8x/day) is fine if you want
    # fresher data and don't mind roughly double the growth.
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Never let two runs write the store at once.
concurrency:
  group: gridcast-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      # Rebuilds the DuckDB working store from the committed Parquet snapshots.
      - name: Restore store
        run: uv run gridcast init

      - name: Fetch latest
        env:
          # Optional: unlocks the EIA deep-history backbone. The run succeeds
          # without it -- CAISO and Open-Meteo need no credentials at all.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: uv run gridcast update --verbose

      - name: Render static site data
        run: uv run gridcast export

      # Parquet is ~5.9MB of already-compressed binary, so git can neither
      # shrink nor delta it -- every snapshot commit stores a near-full new
      # copy, and it dominates repo growth. The website never reads it; it
      # exists so `gridcast init` gives a fresh clone real data. Weekly is
      # plenty for that, and cuts growth by roughly an order of magnitude.
      - name: Snapshot Parquet (weekly)
        run: |
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" -lt 6 ]; then
            echo "weekly snapshot"
            uv run gridcast snapshot
          else
            echo "skipping Parquet snapshot (not the weekly window)"
          fi

      - run: uv run gridcast stats

      - name: Commit if anything changed
        run: |
          git config user.name  'gridcast-bot'
          git config user.email 'gridcast-bot@users.noreply.github.com'
          git add data/parquet web/data
          if git diff --staged --quiet; then
            echo 'no change'
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
